<!-- Patient Census Board -->
<div class="view" id="view-census">
  <div class="census-panel">
    <div class="census-header">
      <h2>Patient Census</h2>
      <span class="census-count" id="census-count">Loading...</span>
      <div class="census-actions">
        <button class="btn-secondary" onclick="loadCensus()">&#8635; Refresh</button>
        <button class="btn-primary" onclick="switchView('handoff')">Open Handoff</button>
      </div>
    </div>
    <div class="census-body" id="census-body">
      <div class="census-empty">
        <div class="census-empty-icon">&#9638;</div>
        <div>Loading patient census...</div>
      </div>
    </div>
  </div>
</div>
