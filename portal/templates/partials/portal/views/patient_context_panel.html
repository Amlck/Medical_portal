<!-- Shared patient context side panel -->
<div id="patient-context-panel">
  <div class="pc-header">
    <div class="pc-header-info">
      <div class="pc-title" id="patient-context-title">Quick Context</div>
      <div class="pc-subtitle" id="patient-context-subtitle">Compact preview for the active patient.</div>
    </div>
    <button class="pc-close" onclick="closePatientContextDrawer()">✕</button>
  </div>
  <div class="pc-body" id="patient-context-body">
    <div class="pc-empty">No active patient selected.</div>
  </div>
</div>
