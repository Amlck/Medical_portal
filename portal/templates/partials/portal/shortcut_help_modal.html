<div class="shortcut-help-overlay" id="shortcut-help-overlay" onclick="if (event.target === this) closeShortcutHelp()">
  <div class="shortcut-help-modal" role="dialog" aria-modal="true" aria-labelledby="shortcut-help-title">
    <div class="shortcut-help-header">
      <h3 id="shortcut-help-title">Keyboard Shortcuts</h3>
      <button class="shortcut-help-close" onclick="closeShortcutHelp()" title="Close">&times;</button>
    </div>
    <div class="shortcut-help-body">
      <div class="shortcut-help-grid">
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+1</span><span>Handoff Tool</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+2</span><span>Admissions</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+3</span><span>PHI Remover</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+4</span><span>Calculator</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+5</span><span>Census</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+9</span><span>Patient Context</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Alt+0 / ?</span><span>Open shortcut help</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Esc</span><span>Close help or settings</span></div>
        <div class="shortcut-help-row"><span class="shortcut-help-keys">Ctrl/Cmd+[</span><span>Toggle sidebar</span></div>
      </div>
    </div>
  </div>
</div>
