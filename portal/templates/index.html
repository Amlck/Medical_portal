<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply theme immediately to prevent flash of wrong theme
    (function() {
      var t = localStorage.getItem('medical-portal-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ portal_config.portal_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ---- Light theme (default) ---- */
    :root {
      --bg:        #f8fafc;
      --surface:   #ffffff;
      --surface2:  #f1f5f9;
      --border:    #e2e8f0;
      --text:      #1e293b;
      --text-dim:  #64748b;
      --accent:    #0891b2;
      --accent-bg: rgba(8,145,178,0.08);
      --green:     #059669;
      --green-bg:  rgba(5,150,105,0.08);
      --warn:      #f59e0b;
      --warn-bg:   rgba(245,158,11,0.08);
      --red:       #ef4444;
      --mono:      'IBM Plex Mono', monospace;
    }
    /* ---- Dark theme ---- */
    html[data-theme="dark"] {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2129;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-dim:  #8b949e;
      --accent:    #58a6ff;
      --accent-bg: rgba(88,166,255,0.08);
      --green:     #3fb950;
      --green-bg:  rgba(63,185,80,0.08);
      --warn:      #f0883e;
      --warn-bg:   rgba(240,136,62,0.08);
      --red:       #f85149;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, min-width 0.2s ease;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: 52px;
      min-width: 52px;
    }

    .sidebar-brand {
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      white-space: nowrap;
    }
    .sidebar-brand h1 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .sidebar-brand span {
      font-size: 0.6rem;
      color: var(--text-dim);
      display: block;
      margin-top: 2px;
    }
    .sidebar-brand-text {
      overflow: hidden;
      transition: opacity 0.15s;
    }
    .sidebar.collapsed .sidebar-brand-text { opacity: 0; width: 0; }
    .sidebar.collapsed .sidebar-brand { justify-content: center; padding: 1.1rem 0; }

    .sidebar-toggle {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .sidebar-toggle:hover { color: var(--text); }
    .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }

    .nav { flex: 1; padding: 0.6rem 0.5rem; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 0.75rem;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.12s;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-dim);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-bg); color: var(--accent); border-left: 2px solid var(--accent); }
    .nav-item.disabled { opacity: 0.35; cursor: default; }
    .nav-item.disabled:hover { background: none; color: var(--text-dim); }
    .nav-item .nav-badge {
      font-size: 0.5rem;
      background: var(--accent);
      color: var(--bg);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      flex-shrink: 0;
      min-width: 1.2rem;
      text-align: center;
    }
    .sidebar.collapsed .nav-badge { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 0.6rem 0; gap: 0; }
    .sidebar.collapsed .nav-item.active { border-left: none; border-bottom: 2px solid var(--accent); border-radius: 0; }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .nav-label { flex: 1; overflow: hidden; transition: opacity 0.15s; }
    .sidebar.collapsed .nav-label { opacity: 0; width: 0; display: none; }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .status-dot.alive { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .status-dot.dead { background: var(--red); }
    .sidebar.collapsed .status-dot { opacity: 0; width: 0; display: none; }

    /* Nav drag-to-reorder */
    .nav-item[draggable="true"] { user-select: none; cursor: grab; }
    .nav-item[draggable="true"]:active { cursor: grabbing; }
    .nav-item[draggable="true"]::before {
      content: '⠿';
      font-size: 0.65rem;
      color: transparent;
      width: 8px;
      flex-shrink: 0;
      transition: color 0.15s;
      line-height: 1;
    }
    .nav-item[draggable="true"]:hover::before { color: var(--text-dim); }
    .sidebar.collapsed .nav-item[draggable="true"]::before { display: none; }
    .nav-item.dragging { opacity: 0.3; }
    .nav-item.drag-over { box-shadow: 0 2px 0 var(--accent); }

    /* ---- Music Player ---- */
    .music-player { border-top:1px solid var(--border); padding:0.55rem 0.75rem 0.5rem; flex-shrink:0; font-family:var(--mono); }
    .music-top { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; }
    .music-track-name { font-size:0.58rem; font-weight:600; color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .music-track-name.idle { color:var(--text-dim); font-weight:400; font-size:0.55rem; }
    .music-progress { width:100%; height:3px; margin:0.15rem 0 0.2rem; cursor:pointer; accent-color:var(--accent); display:block; }
    .music-controls { display:flex; align-items:center; gap:0.1rem; }
    .music-btn { background:none; border:none; padding:0.18rem 0.32rem; border-radius:4px; cursor:pointer; font-size:0.72rem; color:var(--text-dim); font-family:var(--mono); line-height:1; }
    .music-btn:hover { background:var(--surface2); color:var(--text); }
    .music-btn.active { color:var(--accent); }
    .music-vol-wrap { display:flex; align-items:center; gap:0.2rem; margin-left:auto; }
    .music-vol { width:44px; height:3px; cursor:pointer; accent-color:var(--accent); }
    .music-list-panel { max-height:165px; overflow-y:auto; margin-bottom:0.35rem; border:1px solid var(--border); border-radius:5px; background:var(--bg); }
    .music-list-item { padding:0.28rem 0.6rem; font-size:0.57rem; cursor:pointer; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-bottom:1px solid var(--border); }
    .music-list-item:last-child { border-bottom:none; }
    .music-list-item:hover { background:var(--surface2); color:var(--text); }
    .music-list-item.active { color:var(--accent); font-weight:700; background:var(--accent-bg); }
    .music-empty { padding:0.5rem 0.6rem; font-size:0.57rem; color:var(--text-dim); line-height:1.6; }
    /* Collapsed sidebar: hide everything except play button */
    .sidebar.collapsed .music-player { padding:0.35rem 0; display:flex; flex-direction:column; align-items:center; }
    .sidebar.collapsed .music-top { display:none; }
    .sidebar.collapsed .music-progress { display:none !important; }
    .sidebar.collapsed .music-list-panel { display:none !important; }
    .sidebar.collapsed .music-btn:not(#music-play-btn) { display:none; }
    .sidebar.collapsed .music-vol-wrap { display:none; }

    .sidebar-footer {
      padding: 0.8rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.55rem;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity 0.15s;
    }
    .sidebar.collapsed .sidebar-footer { opacity: 0; padding: 0.4rem; }
    .sidebar-patient-picker { margin-bottom: 0.45rem; text-align: left; }
    .sidebar-patient-label { display:block; font-size:0.5rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-bottom:0.18rem; }
    .sidebar-patient-row { display:flex; gap:0.35rem; align-items:center; }
    .sidebar-patient-row select { flex:1; min-width:0; font-family:var(--mono); font-size:0.58rem; padding:0.26rem 0.35rem; border:1px solid var(--border); border-radius:4px; background:var(--surface2); color:var(--text); }
    .sidebar-patient-open-btn { padding:0.22rem 0.42rem; border:1px solid var(--border); border-radius:4px; background:var(--surface2); color:var(--text-dim); cursor:pointer; font-size:0.6rem; font-family:var(--mono); flex-shrink:0; position:relative; display:inline-flex; align-items:center; justify-content:center; gap:0.18rem; }
    .sidebar-patient-open-btn:hover { color:var(--text); border-color:var(--text-dim); }
    .sidebar-patient-open-btn.has-patient { color:var(--accent); border-color:var(--accent); }
    .sidebar-patient-open-btn.active { background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
    .sidebar-patient-open-badge {
      position:absolute;
      top:-0.34rem;
      right:-0.34rem;
      min-width:1rem;
      padding:0.05rem 0.2rem;
      border-radius:999px;
      background:var(--red);
      color:#fff;
      font-size:0.46rem;
      font-weight:700;
      line-height:1.2;
      border:1px solid rgba(255,255,255,0.35);
      box-shadow:0 3px 10px rgba(15,23,42,0.18);
    }
    .sidebar-patient-meta { margin-top:0.3rem; font-size:0.5rem; line-height:1.45; color:var(--text-dim); white-space:normal; min-height:2.1em; }
    .sidebar.collapsed .sidebar-patient-picker { display:none; }

    /* ---- Main ---- */
    .main { flex: 1; display: flex; flex-direction: row; overflow: hidden; }
    #views-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* Iframe views */
    .view { display: none; flex: 1; overflow: hidden; }
    .view.active { display: flex; flex-direction: column; }
    .view iframe {
      flex: 1;
      border: none;
      background: var(--bg);
    }

    /* ---- PHI Remover Panel ---- */
    .phi-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .phi-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .phi-header h2 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .phi-header p {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .phi-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Upload zone */
    .phi-upload-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .drop-area {
      width: 100%;
      max-width: 500px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-area:hover,
    .drop-area.dragover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .drop-area .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      opacity: 0.6;
    }
    .drop-area .drop-text {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .drop-area .drop-hint {
      font-size: 0.6rem;
      color: var(--text-dim);
      opacity: 0.6;
    }

    .phi-options {
      margin-top: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .phi-options label {
      font-size: 0.7rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }
    .phi-options input[type="checkbox"] {
      accent-color: var(--accent);
    }

    /* Hidden file input */
    #phi-file-input { display: none; }

    /* Processing state */
    .phi-processing {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      gap: 1rem;
    }
    .phi-processing.active { display: flex; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Results panel */
    .phi-results {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    .phi-results.active { display: flex; }

    .result-header {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .result-header .result-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--green);
    }
    .result-header .result-meta {
      font-size: 0.65rem;
      color: var(--text-dim);
    }
    .result-actions {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }

    .result-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .result-summary {
      width: 260px;
      min-width: 260px;
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      background: var(--surface);
    }
    .result-summary h4 {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
    }
    .phi-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      font-size: 0.68rem;
    }
    .phi-stat .phi-type { color: var(--text-dim); }
    .phi-stat .phi-count {
      color: var(--warn);
      font-weight: 600;
      background: var(--warn-bg);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.6rem;
    }
    .phi-total {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .phi-total .count { color: var(--red); }

    .result-preview {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      font-size: 0.75rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: var(--text-dim);
    }

    /* ---- Calculator Panel ---- */
    /* Calculator category tabs */
    .calc-cats { display:flex; gap:0.35rem; flex-wrap:wrap; padding: 0.6rem 1.5rem 0; }
    .calc-cat-btn {
      padding: 0.25rem 0.65rem; font-size: 0.62rem; font-family: var(--mono);
      border: 1px solid var(--border); border-radius: 4px; background: var(--bg);
      color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    }
    .calc-cat-btn:hover { border-color: var(--accent); color: var(--accent); }
    .calc-cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .calc-cat-btn .cat-count { font-size:0.55rem; opacity:0.7; margin-left:0.25rem; }
    .calc-cat-section { display: none; }
    .calc-cat-section.active { display: block; }
    .calc-cat-title {
      font-size: 0.7rem; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 0.5rem 0 0.3rem; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem;
    }
    .calc-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .calc-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .calc-header h2 { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .calc-header p { font-size: 0.68rem; color: var(--text-dim); margin-top: 4px; }
    .calc-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
      align-content: start;
    }
    .calc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      transition: border-color 0.15s;
    }
    .calc-card:hover { border-color: var(--accent); }
    .calc-card h3 {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }
    .calc-card .calc-desc {
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-bottom: 0.7rem;
    }
    .calc-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .calc-row label {
      font-size: 0.65rem;
      color: var(--text-dim);
      min-width: 90px;
      flex-shrink: 0;
    }
    .calc-row input, .calc-row select {
      flex: 1;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      max-width: 120px;
    }
    .calc-row input:focus, .calc-row select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .calc-result {
      margin-top: 0.6rem;
      padding: 0.5rem 0.7rem;
      background: var(--accent-bg);
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      min-height: 1.8rem;
      display: flex;
      align-items: center;
      line-height: 1.55;
      white-space: normal;
    }
    .calc-result.rich {
      display: block;
      align-items: initial;
    }
    .calc-result.warn { background: var(--warn-bg); color: var(--warn); }
    .calc-result.danger { background: rgba(239,68,68,0.08); color: var(--red); }
    .calc-result.success { background: var(--green-bg); color: var(--green); }
    .calc-clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.6rem;
      padding: 0.15rem 0.4rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .calc-clear-btn:hover { background: rgba(239,68,68,0.08); color: var(--red); border-color: var(--red); }
    .calc-copy-btn {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-dim); cursor: pointer; font-size: 0.6rem;
      padding: 0.15rem 0.4rem; transition: all 0.15s; flex-shrink: 0; margin-right: 0.2rem;
    }
    .calc-copy-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .calc-copy-btn.copied { background: var(--green-bg); color: var(--green); border-color: var(--green); }
    .calc-result-row { display: flex; align-items: stretch; gap: 0; margin-top: 0.6rem; }
    .calc-result-row .calc-result { margin-top: 0; flex: 1; border-radius: 4px 0 0 4px; }
    .calc-result-row .calc-copy-result {
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-bg); border: none; border-left: 1px solid var(--border);
      border-radius: 0 4px 4px 0; cursor: pointer; padding: 0 0.5rem;
      color: var(--text-dim); font-size: 0.65rem; transition: all 0.15s;
    }
    .calc-result-row .calc-copy-result:hover { background: var(--accent); color: #fff; }
    .calc-result-row .calc-copy-result.copied { background: var(--green); color: #fff; }
    .calc-patient-loader {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .calc-lab-paste {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .calc-lab-paste-toggle {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .calc-lab-paste-toggle:hover { text-decoration: underline; }

    .drugs-search { flex:1; min-width:160px; max-width:260px; padding:0.32rem 0.6rem; border:1px solid var(--border); border-radius:5px; font-size:0.68rem; background:var(--bg); color:var(--text); font-family:var(--mono); }
    .drugs-cat-btn { padding:0.28rem 0.65rem; border:1px solid var(--border); border-radius:5px; font-size:0.6rem; cursor:pointer; background:var(--surface); color:var(--text-dim); font-family:var(--mono); font-weight:600; letter-spacing:0.03em; transition:background 0.15s,color 0.15s; }
    .drugs-cat-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .drugs-sub-btn { padding:0.2rem 0.5rem; border:1px solid var(--border); border-radius:4px; font-size:0.58rem; cursor:pointer; background:var(--surface); color:var(--text-dim); font-family:var(--mono); font-weight:600; transition:background 0.15s,color 0.15s; }
    .drugs-sub-btn.active { background:rgba(59,130,246,0.12); color:var(--accent); border-color:var(--accent); }
    .drug-grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:0.65rem; padding:0.9rem; align-content:start; }
    .drug-card { border:1px solid var(--border); border-radius:8px; padding:0.75rem; cursor:pointer; background:var(--surface); transition:border-color 0.15s,box-shadow 0.15s; display:flex; flex-direction:column; gap:0.25rem; }
    .drug-card:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    .drug-card-name { font-size:0.72rem; font-weight:700; color:var(--text); line-height:1.3; }
    .drug-card-class { font-size:0.57rem; color:var(--text-dim); line-height:1.4; }
    .drug-card-spectrum { font-size:0.57rem; color:var(--text-dim); margin-top:0.15rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .drug-card-composition { font-size:0.52rem; color:var(--accent); font-family:var(--mono); margin-top:0.15rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.45; }
    .drug-card-footer { display:flex; gap:0.3rem; margin-top:auto; padding-top:0.35rem; flex-wrap:wrap; }
    .drug-card-alerts { display:flex; gap:0.25rem; flex-wrap:wrap; margin-top:0.15rem; }
    .drug-alert-chip { display:inline-flex; align-items:center; gap:0.2rem; font-size:0.5rem; padding:0.12rem 0.36rem; border-radius:999px; font-weight:700; letter-spacing:0.03em; border:1px solid var(--border); white-space:nowrap; }
    .drug-alert-chip.warn { background:var(--warn-bg); color:var(--warn); border-color:rgba(245,158,11,0.35); }
    .drug-alert-chip.danger { background:rgba(239,68,68,0.12); color:var(--red); border-color:rgba(239,68,68,0.35); }
    .drug-alert-chip.info { background:rgba(59,130,246,0.12); color:var(--accent); border-color:rgba(59,130,246,0.3); }
    .drug-group-betalactam { border-left:3px solid #3b82f6; }
    .drug-group-grampos    { border-left:3px solid #10b981; }
    .drug-group-quinolone  { border-left:3px solid #f59e0b; }
    .drug-group-antifungal { border-left:3px solid #8b5cf6; }
    .drug-group-other      { border-left:3px solid var(--border); }
    .drug-group-insulin    { border-left:3px solid #ec4899; }
    .drug-group-fluid      { border-left:3px solid #06b6d4; }
    .drug-group-nsaid      { border-left:3px solid #f97316; }
    .drug-group-laxative   { border-left:3px solid #84cc16; }
    .drug-group-hypnotic   { border-left:3px solid #6366f1; }
    .drugs-empty { display:none; padding:2rem; text-align:center; color:var(--text-dim); font-size:0.68rem; grid-column:1/-1; }

    /* ---- Buttons ---- */
    button {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-green {
      background: var(--green);
      color: var(--bg);
      border-color: var(--green);
    }
    .btn-green:hover { filter: brightness(1.15); }
    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }

    /* ---- Offline overlay for iframe tools ---- */
    .offline-overlay {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.6rem;
      color: var(--text-dim);
      font-size: 0.75rem;
    }
    .offline-overlay .offline-icon { font-size: 2rem; opacity: 0.4; }

    /* ---- Theme toggle ---- */
    .sidebar-footer-controls { display:flex; gap:0.4rem; margin-bottom:0.35rem; }
    .sidebar.collapsed .sidebar-footer-controls { flex-direction:column; gap:0.25rem; }
    .theme-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
      font-family: var(--mono);
      font-weight: 500;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--text-dim); }
    .sidebar.collapsed .theme-toggle .theme-label { display: none; }
    .sidebar.collapsed .theme-toggle { padding: 0.3rem; }

    /* ---- Settings button ---- */
    .settings-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
      font-family: var(--mono);
      font-weight: 500;
    }
    .settings-toggle:hover { color: var(--text); border-color: var(--text-dim); }
    .sidebar.collapsed .settings-toggle .settings-label { display: none; }
    .sidebar.collapsed .settings-toggle { padding: 0.3rem; }
    .settings-toggle.has-key { color: var(--green); border-color: var(--green); }

    /* ---- Settings Modal ---- */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .settings-overlay.active { display: flex; }
    .settings-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 480px;
      max-width: 90vw;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .settings-modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .settings-modal-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .settings-modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem;
    }
    .settings-modal-close:hover { color: var(--text); }
    .settings-modal-body {
      padding: 1.25rem;
    }
    .settings-field { margin-bottom: 1rem; }
    .settings-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      letter-spacing: 0.03em;
    }
    .settings-field .field-hint {
      font-size: 0.6rem;
      color: var(--text-dim);
      opacity: 0.7;
      margin-top: 0.3rem;
      line-height: 1.5;
    }
    .settings-input-row {
      display: flex;
      gap: 0.5rem;
    }
    .settings-input-row input {
      flex: 1;
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface2);
      color: var(--text);
      outline: none;
    }
    .settings-input-row input:focus { border-color: var(--accent); }
    .settings-input-row button {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .settings-input-row button:hover { border-color: var(--text-dim); color: var(--text); }
    .settings-save-btn {
      background: var(--accent) !important;
      color: var(--bg) !important;
      border-color: var(--accent) !important;
    }
    .settings-save-btn:hover { opacity: 0.9; }
    .settings-status {
      margin-top: 0.8rem;
      padding: 0.5rem 0.7rem;
      border-radius: 5px;
      font-size: 0.65rem;
      display: none;
    }
    .settings-status.success {
      display: block;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }
    .settings-status.error {
      display: block;
      background: rgba(239,68,68,0.08);
      color: var(--red);
      border: 1px solid var(--red);
    }
    .settings-status.info {
      display: block;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .api-key-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.62rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      margin-top: 0.4rem;
    }
    .api-key-indicator.active {
      background: var(--green-bg);
      color: var(--green);
    }
    .api-key-indicator.inactive {
      background: var(--warn-bg);
      color: var(--warn);
    }

    /* ---- Shortcut Help ---- */
    .shortcut-help-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 9998;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .shortcut-help-overlay.active { display: flex; }
    .shortcut-help-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 520px;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .shortcut-help-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .shortcut-help-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .shortcut-help-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem;
    }
    .shortcut-help-close:hover { color: var(--text); }
    .shortcut-help-body { padding: 1.1rem 1.25rem 1.2rem; }
    .shortcut-help-grid { display: grid; gap: 0.55rem; }
    .shortcut-help-row {
      display: grid;
      grid-template-columns: minmax(110px, 140px) minmax(0, 1fr);
      gap: 0.8rem;
      align-items: center;
      font-size: 0.68rem;
      color: var(--text);
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      background: var(--surface2);
    }
    .shortcut-help-keys {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.18rem 0.42rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
